name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Build Web UI Assets
        run: |
          cd web
          npm ci
          npm run check
          npm test
          npm run build
          npm audit --audit-level=high
          
      - name: Format Check
        run: cargo fmt --all -- --check
        
      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings
        
      - name: Dependency advisories
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

      - name: Run Tests
        run: cargo test --workspace --verbose

      - name: Run Hermes Plugin Tests
        run: python3 plugins/hermes/context-watcher/test_plugin.py

      - name: Offline smoke admission and fixture checks
        run: |
          python3 -B -m unittest discover -s benchmark/cw104b -p test_smoke.py -v
          python3 -B benchmark/cw104b/smoke.py --manifest-dir "$RUNNER_TEMP/cw104b-offline"

      - name: CW-122A offline pruning readiness
        run: |
          python3 -B -m unittest discover -s benchmark/cw122a -p test_campaign.py -v
          python3 -B benchmark/cw122a/rehearse.py --output "$RUNNER_TEMP/cw122a-offline"
