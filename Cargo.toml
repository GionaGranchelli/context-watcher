[workspace]
resolver = "2"
members = [
    "crates/cw-core",
    "crates/cw-store",
    "crates/cw-proxy",
    "crates/cw-harnesses",
    "crates/cw-mcp",
    "crates/cw-tui",
    "crates/cw-cli",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Giona Granchelli"]
repository = "https://github.com/GionaGranchelli/context-watcher"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
tokio-stream = "0.1"
bytes = "1.7"
blake3 = "1.5"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6.1"
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.11"
rust-embed = "8.5"
mime_guess = "2.0"

# Internal crates
cw-core = { path = "crates/cw-core" }
cw-store = { path = "crates/cw-store" }
cw-proxy = { path = "crates/cw-proxy" }
cw-harnesses = { path = "crates/cw-harnesses" }
cw-mcp = { path = "crates/cw-mcp" }
cw-tui = { path = "crates/cw-tui" }
